<c-modal #verticallyCenteredModal
         alignment="center" id="verticallyCenteredModal" size="lg">
  <c-modal-header>
    <h5 cModalTitle>Registrar votantes</h5>
<!--    <button [cModalToggle]="verticallyCenteredModal.id" cButtonClose></button>-->
  </c-modal-header>
  <c-modal-body>
    <form [formGroup]="voterForm" (ngSubmit)="registerVoter()">
      <c-row [gutter]="3" class="align-items-center">
        <c-col xs="12" sm="6">
          <label for="name">Nombre</label>
          <input id="name" formControlName="name" type="text" cFormControl />
        </c-col>

        <c-col xs="12" sm="6">
          <label for="lastname">Apellidos</label>
          <input id="lastname" formControlName="lastname" type="text" cFormControl />
        </c-col>

        <c-col xs="12" sm="6">
          <label for="identity_document">Documento de Identidad</label>
          <input id="identity_document" formControlName="identity_document" type="text" cFormControl />
        </c-col>

        <c-col xs="12" sm="6">
          <label for="phone">Teléfono</label>
          <input id="phone" formControlName="phone" type="text" cFormControl />
        </c-col>

        <c-col xs="12" sm="6">
          <label for="birth_date">Fecha de nacimiento</label>
          <input id="birth_date" formControlName="birth_date" type="date" cFormControl />
        </c-col>

        <c-col xs="12" sm="6">
          <label for="nationality_id">Nacionalidad (ID)</label>
          <input id="nationality_id" formControlName="nationality_id" type="number" cFormControl />
        </c-col>
      </c-row>
      <c-row [gutter]="3" class="align-items-center mt-3">
        <c-col xs="12" sm="6">
          <button cButton color="primary" type="submit">Registrar</button>
        </c-col>
        <c-col xs="12" sm="6">
          <button [cModalToggle]="verticallyCenteredModal.id" cButton color="secondary">
            Cancelar
          </button>
        </c-col>
      </c-row>
    </form>
  </c-modal-body>
  <c-modal-footer>
  </c-modal-footer>
</c-modal>
