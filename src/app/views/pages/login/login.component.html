<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">

        <!-- Pantalla de selección de tipo de acceso -->
        <div *ngIf="!showLogin">
          <c-card class="p-4 text-center">
            <c-card-body>
              <h1 class="mb-4">Selecciona tu tipo de acceso</h1>
              <p class="text-body-secondary mb-5">Elige el tipo de usuario con el que deseas ingresar al sistema</p>

              <c-row class="justify-content-center">
                <c-col md="5" class="mb-3">
                  <button
                    cButton
                    size="lg"
                    color="primary"
                    class="w-100 py-4"
                    (click)="selectUserType('admin')"
                  >
                    <div class="d-flex flex-column align-items-center">
                      <svg cIcon="cilShieldCheck" class="mb-2" width="32" height="32"></svg>
                      <h4 class="mb-1">Administrador</h4>
                      <small>Acceder como administrador</small>
                    </div>
                  </button>
                </c-col>

                <c-col md="5" class="mb-3">
                  <button
                    cButton
                    size="lg"
                    color="success"
                    class="w-100 py-4"
                    (click)="selectUserType('voter')"
                  >
                    <div class="d-flex flex-column align-items-center">
                      <svg cIcon name="cilUser" class="mb-2" width="32" height="32"></svg>
                      <h4 class="mb-1">Votante</h4>
                      <small>Acceder como votante</small>
                    </div>
                  </button>
                </c-col>
              </c-row>
            </c-card-body>
          </c-card>
        </div>

        <!-- Pantalla de login -->
        <c-card-group *ngIf="showLogin">
          <c-card class="p-4">
            <c-card-body>
              <!-- Botón de volver -->
              <div class="mb-3">
                <button
                  cButton
                  color="light"
                  size="sm"
                  class="px-3"
                  (click)="goBack()"
                >
                  <svg cIcon name="cilArrowLeft" class="me-1"></svg>
                  Volver
                </button>
              </div>

              <form [formGroup]="form" (ngSubmit)="submit()">
                <h1>Bienvenido</h1>
                <p class="text-body-secondary">
                  Ingresa tus credenciales para iniciar sesión como
                  <span class="fw-bold text-capitalize">{{ typeLogin }}</span>
                </p>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input
                    formControlName="uname"
                    name="username"
                    autoComplete="username"
                    cFormControl
                    placeholder="Usuario"
                  />
                </c-input-group>

                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    formControlName="password"
                    name="password"
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Contraseña"
                    type="password"
                  />
                </c-input-group>

                <c-row>
                  <c-col xs="6">
                    <button
                      cButton
                      type="submit"
                      class="px-4"
                      color="primary"
                    >
                      Iniciar Sesión
                    </button>
                  </c-col>
                  <c-col class="text-right" xs="6">
                    <button
                      cButton
                      class="px-0"
                      color="primary"
                      type="button"
                    >
                      ¿Olvidaste tu contraseña?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>

          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Regístrate</h2>
                <p>
                  Si aún no tienes una cuenta, puedes registrarte para acceder a todas las funcionalidades de la aplicación.
                </p>
                <button
                  [active]="true"
                  cButton
                  class="mt-3"
                  color="primary"
                  routerLink="/register"
                >
                  ¡Registrarme ahora!
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>

      </c-col>
    </c-row>
  </c-container>
</div>
