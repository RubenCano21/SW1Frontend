<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="7" md="9" xl="6">
        <c-card class="mx-4">
          <c-card-body class="p-4">
            <form cForm (ngSubmit)="register()">
              <h1>Registrate</h1>
              <p class="text-body-secondary">Crea tu cuenta</p>

              <!-- Nombre de usuario -->
              <c-input-group class="mb-3">
                <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                <input [(ngModel)]="user.username" name="username" cFormControl required placeholder="Nombre de usuario" />
              </c-input-group>

              <!-- Nombre completo -->
              <c-input-group class="mb-3">
                <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                <input [(ngModel)]="user.full_name" name="full_name" cFormControl required placeholder="Nombre completo" />
              </c-input-group>

              <!-- Email -->
              <c-input-group class="mb-3">
                <span cInputGroupText>&#64;</span>
                <input [(ngModel)]="user.email" name="email" cFormControl required placeholder="Correo electrónico" type="email" />
              </c-input-group>

              <!-- Contraseña -->
              <c-input-group class="mb-3">
                <span cInputGroupText><svg cIcon name="cilLockLocked"></svg></span>
                <input [(ngModel)]="user.password" name="password" cFormControl required placeholder="Contraseña" type="password" />
              </c-input-group>

              <!-- Confirmación (opcional, solo en frontend) -->
<!--              <c-input-group class="mb-4">-->
<!--                <span cInputGroupText><svg cIcon name="cilLockLocked"></svg></span>-->
<!--                <input [(ngModel)]="confirmPassword" name="confirmPassword" cFormControl required placeholder="Confirmar contraseña" type="password" />-->
<!--              </c-input-group>-->

              <div class="d-grid">
                <hr />
                <button cButton color="success" type="submit">Crear Cuenta</button>
                <p>¿Ya tienes una cuenta? Inicia sesión <a routerLink="/login">aquí</a></p>
              </div>
            </form>

          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
