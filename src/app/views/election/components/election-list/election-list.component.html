
<c-card>
  <c-card-header>
    <h5 class="card-title mb-0">Mis Elecciones</h5>
  </c-card-header>
  <c-card-body>
      <app-election-widget></app-election-widget>
    <c-progress [value]="25" color="success">25%</c-progress>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let election of elections">
          <td>{{ election.description }}</td>
          <td>{{ election.allow_multiple_votes }}</td>
          <td>{{ election.status }}</td>
          <td>
            <button class="btn btn-primary" (click)="viewDetails(election.id)">Ver Detalles</button>
            <button class="btn btn-secondary" (click)="editElection(election.id)">Editar</button>
            <button class="btn btn-danger" (click)="deleteElection(election.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>
