<c-card>
  <c-card-header>
    <h2>Registrar Región</h2>
  </c-card-header>

  <c-card-body>
    <form [formGroup]="regionForm" (ngSubmit)="onSubmit()">
      <c-row [gutter]="3" class="align-items-center">
        <c-col xs="12" sm="6">
          <label for="name">Nombre</label>
          <input
            id="name"
            formControlName="name"
            type="text"
            cFormControl
            [class.is-invalid]="regionForm.get('name')?.invalid && regionForm.get('name')?.touched"
          />
          <small *ngIf="regionForm.get('name')?.errors?.['required'] && regionForm.get('name')?.touched" class="text-danger">
            El nombre es requerido.
          </small>
        </c-col>

        <c-col xs="12" sm="6">
          <label for="id_country">País (ID)</label>
          <input
            id="id_country"
            formControlName="id_country"
            type="number"
            cFormControl
            [class.is-invalid]="regionForm.get('id_country')?.invalid && regionForm.get('id_country')?.touched"
          />
          <small *ngIf="regionForm.get('id_country')?.errors?.['required'] && regionForm.get('id_country')?.touched" class="text-danger">
            El ID del país es requerido.
          </small>
        </c-col>
      </c-row>

      <c-row [gutter]="3" class="align-items-center mt-3">
        <c-col xs="12" sm="6">
          <button cButton color="primary" type="submit" [disabled]="regionForm.invalid">Registrar</button>
        </c-col>
        <c-col xs="12" sm="6">
          <button cButton color="secondary" type="button" (click)="regionForm.reset()">Cancelar</button>
        </c-col>
      </c-row>
    </form>
  </c-card-body>
</c-card>
